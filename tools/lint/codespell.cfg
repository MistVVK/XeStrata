# codespell for XeStrata (tools/lint/run.sh): identifiers it would take for misspellings
[codespell]
ignore-words-list = nd,fo,te,nin,dout,optin,renderd,rcall,caf,espace
# recorded model output in other languages
skip = */fixtures/*
