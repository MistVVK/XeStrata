# ruff for XeStrata's Python (tools/lint/run.sh): its default rules, lines up to 120 characters
line-length = 120
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]   # ruff's defaults, pinned (a user configuration must not widen them)
