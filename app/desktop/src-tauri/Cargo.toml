[package]
name = "strata-desktop"
version = "0.2.18"
description = "Strata Desktop — local AI, tuned to one model."
edition = "2021"
rust-version = "1.77"
license = "MIT"

# Linux: the drop of a file on the window is read straight from the GTK drag signals (see hook_linux_drops in main.rs); the versions are the ones Tauri itself uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"

# Windows: the shell listens for the page's renderer failing (WebView2 ProcessFailed, see hook_renderer_failures in main.rs); these are the versions wry itself uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
# Desktop notifications for an approval that waits (#3477); the tray icon above is Tauri's own.
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The browser developer tools (#5408): compiled into release builds on Windows and Linux so a person who is asked for a console log can open them;
# the window keeps them off unless STRATA_DEVTOOLS=1 (main.rs devtools_wanted). Not on macOS: there Tauri's devtools call private functions.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri = { version = "2", features = ["devtools"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
