version = 1

# XeStrata's own files without a comment of their own
[[annotations]]
path = ["bench/**", "data/**", "docs/paper/**", "serve/web/sprite.svg"]
SPDX-FileCopyrightText = ["2026 Niko1221 and the Strata contributors", "2026 MistVVK and the XeStrata contributors"]
SPDX-License-Identifier = "LGPL-3.0-or-later"

[[annotations]]
path = ["cmake/BUILD.json.in"]
SPDX-FileCopyrightText = "2026 MistVVK and the XeStrata contributors"
SPDX-License-Identifier = "LGPL-3.0-or-later"

# free third-party material: under its own license
[[annotations]]
path = ["third_party/main/ggml/**"]
SPDX-FileCopyrightText = "2023-2026 The ggml authors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["third_party/main/outfit/**"]
SPDX-FileCopyrightText = "2021 The Outfit Project Authors (https://github.com/Outfitio/Outfit-Fonts)"
SPDX-License-Identifier = "OFL-1.1"

# non-free: material made from or copied from the Qwen3.8-Flash-Next model (the READMEs carry their own header)
[[annotations]]
path = ["third_party/nonfree/qwen3.8-flash-next/**", "third_party/nonfree/experimental-speed-projection/**"]
SPDX-FileCopyrightText = "2026 Qwen"
SPDX-License-Identifier = "LicenseRef-Qwen-Community-License-1.0"
